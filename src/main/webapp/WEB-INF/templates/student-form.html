<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加学生</title>
    <style>
        form {
            width: 300px;
            margin: 30px auto;
        }

        label {
            display: inline-block;
            width: 60px;
            margin-bottom: 10px;
        }

        input {
            padding: 4px;
            width: 200px;
        }

        button {
            margin-top: 10px;
            padding: 5px 15px;
        }
    </style>
</head>
<body>
<h1 style="text-align: center;" th:text="${student.id==null}?'添加学生' : '编辑学生'">添加学生</h1>
<form th:action="@{${actionUrl}}"
      th:object="${student}"
      method="post">
    <div>
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name"
               th:field="*{name}" required/>
    </div>
    <div>
        <label for="age">年龄：</label>
        <input type="number" id="age" name="age"
               th:field="*{age}" required/>
    </div>
    <div>
        <label for="email">邮箱：</label>
        <input type="email" id="email" name="email"
               th:field="*{email}" required/>
    </div>
    <div style="text-align: center;">
        <button type="submit" th:text="${student.id==null}?'保存' : '更新'">保存</button>
        <a th:href="@{/}">取消</a>
    </div>
</form>
</body>
</html>
